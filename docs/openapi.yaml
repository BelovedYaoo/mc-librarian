openapi: 3.1.0
info:
  title: MC Librarian API
  version: 0.2.0
  summary: Minecraft 源码知识库与问答服务
  description: |
    面向 agent 与人类、带账号体系的代码知识库服务。对每个 Minecraft 版本提供三路混合检索：

    - **summary** — 中文类摘要（中文问题直接映射到类）
    - **symbol** — 类/方法/字段符号表（tree-sitter 派生）
    - **literal** — 源码字面量与正则检索（ripgrep 派生）

    设计约束：检索接口无状态、`version` 显式必传（不支持 `latest`）；响应带 `why` 与
    `suggestions`；调用方用 `max_tokens` 控制上下文预算；索引由 `JobRunner` 异步执行，
    接口只返回 `202 + job_id`。

servers:
  - url: https://mc-librarian.belovedyaoo.top
    description: 生产（公网边缘节点 47.122.113.116）
  - url: http://127.0.0.1:8787
    description: 本地开发

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: meta
  - name: retrieve
  - name: read
  - name: answer
  - name: auth
  - name: admin

paths:
  /v1/health:
    get:
      tags: [meta]
      summary: 存活探针
      security: []
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, example: "0.2.0" }

  /v1/setup:
    get:
      tags: [auth]
      summary: 是否需要初始化管理员
      description: |
        控制面 `users` 表为空时返回 `required: true`，前端据此把首次访问引导到 `/setup`；
        创建唯一管理员后永久返回 `false`。公开端点，无需会话。
      security: []
      operationId: getSetupStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      tags: [auth]
      summary: 创建唯一管理员并直接登录
      description: |
        仅在 `users` 表为空时可用。成功后返回 `201`、创建出的管理员，并**直接下发会话 cookie**
        （与 `POST /v1/auth/login` 同一套 cookie），前端创建完即可进入后台。
        已初始化时返回 `410`，不再重建、也不覆盖现有账号。公开端点，无需会话。
      security: []
      operationId: createFirstAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: 已创建并登录
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `mc_librarian_session`，HttpOnly + SameSite=Lax；`Secure` 由服务端配置
                `MC_LIBRARIAN_COOKIE_SECURE` 控制（本地 http 为 false，生产为 true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "410": { $ref: "#/components/responses/SetupCompleted" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/versions:
    get:
      tags: [meta]
      summary: 已索引版本列表
      operationId: listVersions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/VersionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/search:
    post:
      tags: [retrieve]
      summary: 混合检索（摘要 / 符号 / 字面量）
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/symbol:
    get:
      tags: [retrieve]
      summary: 符号查找
      operationId: getSymbol
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: fuzzy
          in: query
          schema: { type: boolean, default: true }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/SymbolKind" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/SymbolDetail" }

  /v1/references:
    get:
      tags: [retrieve]
      summary: 反查引用
      operationId: getReferences
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          description: 方法名或 `Class#method`
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceResponse" }

  /v1/outline:
    get:
      tags: [read]
      summary: 文件骨架
      operationId: getOutline
      parameters:
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outline" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/read:
    get:
      tags: [read]
      summary: 源码切片
      description: "`start`/`end` 必填，不提供整文件读取。"
      operationId: readFile
      parameters:
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Path"
        - name: start
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: end
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: max_tokens
          in: query
          schema: { type: integer, minimum: 100, maximum: 32000, default: 4000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileSlice" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ask:
    post:
      tags: [answer]
      summary: 中文问答（服务端检索循环）
      description: |
        默认返回 `text/event-stream`：`step` → `delta`* → `citation`* → `done`。
        请求头 `Accept: application/json` 时退化为一次性返回完整 `AskResponse`。
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/AskEvent" }
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
        "429":
          description: 全局问答已暂停或超出并发
        "503":
          description: 未配置生成模型

  /v1/auth/login:
    post:
      tags: [auth]
      summary: 登录（换取 session cookie）
      description: |
        用户名不存在、密码错误、账号被禁用一律返回同一个 `401` 与同一句文案，
        不暴露「用户是否存在」。成功后更新 `last_login_at` 并下发新的会话 cookie。
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `mc_librarian_session`，HttpOnly + SameSite=Lax；`Secure` 由服务端配置
                `MC_LIBRARIAN_COOKIE_SECURE` 控制（本地 http 为 false，生产为 true），
                有效期见服务端 `session_ttl_hours`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 注销当前会话
      description: |
        删除服务端会话行并清除 cookie。登出后同一个 cookie 再用即 401；
        没有有效会话时同样返回 401（调用方可以忽略并直接跳登录页）。
      operationId: logout
      responses:
        "204": { description: 已注销 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/tokens:
    get:
      tags: [auth]
      summary: 我的 access token 列表
      operationId: listTokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/TokenInfo" }
    post:
      tags: [auth]
      summary: 签发 access token
      description: 明文 token 只在创建时返回一次。
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650, default: 365 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: 仅此一次返回 }
                  info: { $ref: "#/components/schemas/TokenInfo" }

  /v1/auth/tokens/{tokenId}:
    delete:
      tags: [auth]
      summary: 吊销 access token
      operationId: revokeToken
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已吊销 }

  /v1/invites/{token}:
    get:
      tags: [auth]
      summary: 校验邀请链接
      description: |
        链接仍可用时 `valid: true` 并给出对应的用户名；不存在、已使用、已过期或账号被禁用
        一律 `valid: false`（不区分具体原因）。公开端点，无需会话。
      security: []
      operationId: getInvite
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteStatus" }

  /v1/invites/{token}/accept:
    post:
      tags: [auth]
      summary: 接受邀请（设置密码并登录）
      description: |
        被邀请人自设密码，成功后激活账号并**直接下发会话 cookie**（与 `POST /v1/auth/login`
        同一套 cookie），因此设完密码即已登录。链接一次性：成功即标记已用，再用返回 `404`。
        公开端点，无需会话。
      security: []
      operationId: acceptInvite
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "201":
          description: 已设置密码并登录
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `mc_librarian_session`，HttpOnly + SameSite=Lax；`Secure` 由服务端配置
                `MC_LIBRARIAN_COOKIE_SECURE` 控制（本地 http 为 false，生产为 true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/versions:
    post:
      tags: [admin]
      summary: 注册已上传的索引
      description: |
        节点侧不构建索引。管理员把本地生成的 `db/<version>.sqlite` 放进数据根后调用本接口，
        服务端校验文件并写入版本注册表。文件不存在或校验失败返回 422。
      operationId: registerVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", examples: ["26.3"] }
                obfuscated: { type: boolean, default: true }
      responses:
        "201":
          description: 已注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/users:
    get:
      tags: [admin]
      summary: 用户列表
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
    post:
      tags: [admin]
      summary: 创建用户
      description: 创建后返回一次性邀请链接；管理员不设置也不需要知道用户密码。
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 32, pattern: "^[a-zA-Z0-9_.-]+$" }
                role: { type: string, enum: [admin, user], default: user }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [user, invite_url]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  invite_url:
                    type: string
                    description: 一次性邀请链接（站点根下的相对路径），48 小时有效
        "409": { description: 用户名已存在 }

  /v1/admin/users/{userId}:
    patch:
      tags: [admin]
      summary: 修改角色或启用状态
      description: 不允许把最后一个 admin 降级或停用。
      operationId: patchUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, user] }
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 违反最后管理员保护 }

  /v1/admin/jobs:
    get:
      tags: [admin]
      summary: 任务列表
      operationId: listJobs
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: 创建索引任务
      description: |
        立即返回 202，实际执行由 JobRunner 串行消费（并发 1）。
        只接受带 `options.source_dir` 的任务，阶段序列固定 `parse → summarize → finalize`；
        缺 `options.source_dir` 返回 422（`download`/`decompile` 待 #13 引入，见 `JobCreate`）。
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 已有同类任务在运行或该版本正在索引 }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/jobs/{jobId}:
    get:
      tags: [admin]
      summary: 任务详情
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/jobs/{jobId}/logs:
    get:
      tags: [admin]
      summary: 任务日志
      description: "按 `?after=<id>` 增量拉取：只返回 id 大于 `after` 的日志。"
      operationId: getJobLogs
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: after
          in: query
          schema: { type: integer, default: 0 }
          description: 返回 id 大于该值的日志
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/JobLog" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [admin]
      summary: 取消任务
      description: 只对 queued/running 有效；running 任务在当前阶段边界停止。
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已请求取消
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 任务已结束，无法取消 }

  /v1/admin/jobs/{jobId}/retry:
    post:
      tags: [admin]
      summary: 重试任务
      description: |
        只对 `failed` / `canceled` 有效：保留 checkpoint，把同一任务重新置为 `queued`，
        从下一个未完成的阶段续跑。其他状态返回 `409`。
      operationId: retryJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已重新排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 任务不在可重试的终态（仅 failed/canceled） }

  /v1/admin/settings:
    get:
      tags: [admin]
      summary: 读取设置
      description: 密钥字段只返回是否已设置，不返回明文。
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      tags: [admin]
      summary: 更新设置
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /v1/admin/usage:
    get:
      tags: [admin]
      summary: 用量统计
      description: 按请求粒度记录，可聚合。无硬预算，仅用于观测与告警。
      operationId: getUsage
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: user_id
          in: query
          schema: { type: string }
        - name: group_by
          in: query
          schema: { type: string, enum: [day, user, version, model], default: day }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }

  /v1/admin/audit:
    get:
      tags: [admin]
      summary: 审计日志
      operationId: listAudit
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: actor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mc_librarian_session
    bearerAuth:
      type: http
      scheme: bearer
      description: 个人 access token（`mcl_` 前缀）

  parameters:
    Version:
      name: version
      in: query
      required: true
      schema: { type: string, examples: ["1.20.1"] }
      description: 目标版本，必须已完成索引；不支持 latest
    Path:
      name: path
      in: query
      required: true
      schema: { type: string }
      description: 相对仓库根的路径
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string }
      description: 邀请链接里的明文 token

  responses:
    BadRequest:
      description: 请求非法
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        未认证：缺少/过期/已注销的会话 cookie，或登录凭据不正确。
        登录失败的 `detail` 恒定，不区分「用户不存在」与「密码错误」。
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: 已认证但无权访问（例如 `user` 访问 `/v1/admin/*`）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SetupCompleted:
      description: 已完成初始化：唯一管理员已存在，不再开放 setup
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    SymbolKind:
      type: string
      enum: [any, class, method, field]
      default: any

    VersionInfo:
      type: object
      required: [version, files, tokens, indexed_at]
      properties:
        version: { type: string }
        files: { type: integer }
        tokens: { type: integer, description: 源码 token 总量（cl100k 估算） }
        indexed_at: { type: string, format: date-time }
        obfuscated: { type: boolean, description: 是否经官方映射重映射 }
        has_summaries: { type: boolean }
        source_size_bytes: { type: integer }

    SearchRequest:
      type: object
      required: [query, version]
      properties:
        query: { type: string, minLength: 1, maxLength: 512 }
        version: { type: string }
        path_prefix: { type: string }
        kind: { $ref: "#/components/schemas/SymbolKind" }
        detail:
          type: string
          enum: [locate, snippet]
          default: snippet
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
        max_tokens: { type: integer, minimum: 200, maximum: 32000, default: 4000 }

    SearchResponse:
      type: object
      required: [query, version, hits, total, took_ms]
      properties:
        query: { type: string }
        version: { type: string }
        hits:
          type: array
          items: { $ref: "#/components/schemas/Hit" }
        suggestions:
          type: array
          items: { type: string }
        total: { type: integer }
        took_ms: { type: integer }

    Hit:
      type: object
      required: [id, type, version, path, lines, score, why]
      properties:
        id: { type: string, example: "1.20.1:net/minecraft/world/entity/MobCategory.java#MobCategory" }
        type: { type: string, enum: [class, method, field, file] }
        version: { type: string }
        path: { type: string }
        symbol: { type: string }
        lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        score: { type: number, format: float }
        why:
          type: array
          items: { type: string, enum: [summary, symbol, literal, reference] }
        summary: { type: string }
        snippet: { type: string }
        tokens: { type: integer }

    SymbolDetail:
      type: object
      required: [fqn, kind, path, lines]
      properties:
        fqn: { type: string }
        kind: { type: string, enum: [class, method, field] }
        signature: { type: string }
        path: { type: string }
        lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        superclass: { type: string }
        interfaces: { type: array, items: { type: string } }
        annotations: { type: array, items: { type: string } }
        summary: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [method, field] }
              name: { type: string }
              signature: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }

    ReferenceResponse:
      type: object
      required: [symbol, version, references]
      properties:
        symbol: { type: string }
        version: { type: string }
        references:
          type: array
          items:
            type: object
            required: [path, lines]
            properties:
              path: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
              enclosing: { type: string }
              kind: { type: string, enum: [call, field, type, other] }
              snippet: { type: string }

    Outline:
      type: object
      required: [path, package, classes]
      properties:
        path: { type: string }
        package: { type: string }
        imports: { type: array, items: { type: string } }
        classes:
          type: array
          items:
            type: object
            properties:
              fqn: { type: string }
              kind: { type: string, enum: [class, interface, enum, record, annotation] }
              signature: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
              methods:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    signature: { type: string }
                    lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }

    FileSlice:
      type: object
      required: [path, version, start, end, content, truncated]
      properties:
        path: { type: string }
        version: { type: string }
        start: { type: integer }
        end: { type: integer }
        total_lines: { type: integer }
        content: { type: string }
        truncated: { type: boolean }

    AskRequest:
      type: object
      required: [question, version]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        version: { type: string }
        max_steps: { type: integer, minimum: 1, maximum: 12, default: 6 }
        max_answer_tokens: { type: integer, minimum: 500, maximum: 32000, default: 8000 }

    AskEvent:
      oneOf:
        - type: object
          required: [type, tool, args]
          properties:
            type: { type: string, const: step }
            tool: { type: string }
            args: { type: object, additionalProperties: true }
        - type: object
          required: [type, text]
          properties:
            type: { type: string, const: delta }
            text: { type: string }
        - type: object
          required: [type, path, lines]
          properties:
            type: { type: string, const: citation }
            path: { type: string }
            lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
            symbol: { type: string }
        - type: object
          required: [type, usage]
          properties:
            type: { type: string, const: done }
            usage: { $ref: "#/components/schemas/Usage" }
        - type: object
          required: [type, problem]
          properties:
            type: { type: string, const: error }
            problem: { $ref: "#/components/schemas/Problem" }

    AskResponse:
      type: object
      required: [answer, citations]
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
              symbol: { type: string }
        steps:
          type: array
          items:
            type: object
            properties:
              tool: { type: string }
              args: { type: object, additionalProperties: true }
        usage: { $ref: "#/components/schemas/Usage" }

    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        cost_usd: { type: number, format: float }
        latency_ms: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }

    SetupStatus:
      type: object
      required: [required]
      properties:
        required: { type: boolean, description: 控制面还没有任何用户，需要先创建管理员 }

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_.-]+$"
        password: { type: string, minLength: 8, maxLength: 128 }

    InviteStatus:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        username:
          type: string
          description: 邀请对应的用户名；链接无效时为空

    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }

    User:
      type: object
      required: [id, username, role, enabled]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        last_login_at: { type: string, format: date-time }

    TokenInfo:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 前 8 位，用于辨认 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    Job:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [index] }
        version: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        stage:
          type: string
          enum: [parse, summarize, finalize]
          description: |
            任务当前阶段。`#4` 固定为 `parse → summarize → finalize`；
            `#13` 会在前面补 `download`/`decompile`（存储层 CHECK 已保留这两个历史值）。
        progress: { type: number, format: float, minimum: 0, maximum: 1 }
        message: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_by: { type: string }

    JobCreate:
      type: object
      required: [kind, version]
      properties:
        kind: { type: string, enum: [index] }
        version: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", examples: ["26.3"] }
        options:
          type: object
          required: [source_dir]
          properties:
            source_dir:
              type: string
              minLength: 1
              description: |
                源码根目录；相对路径按数据根解析。**必填**：

                - 有 `source_dir` → 阶段序列 `parse → summarize → finalize`，任务从 `parse` 开始；
                - 缺 `source_dir` → 422。`download`/`decompile` 属于 #13，`#4` 不实现也不占位，
                  `#13` 落地后才会把它改成可选并补上这两段。

                `parse` 只统计 `.java` 与 `data/` 的文件数与 token 估算。
            force: { type: boolean, default: false }

    JobLog:
      type: object
      required: [id, ts, level, message]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }

    Settings:
      type: object
      properties:
        llm:
          type: object
          properties:
            base_url: { type: string }
            model: { type: string, example: "deepseek-4.1-flash" }
            api_key_set: { type: boolean, readOnly: true }
            api_key: { type: string, writeOnly: true }
            temperature: { type: number, default: 0.2 }
        ask:
          type: object
          properties:
            max_steps: { type: integer, default: 6 }
            max_answer_tokens: { type: integer, default: 8000 }
            timeout_s: { type: integer, default: 120 }
            enabled: { type: boolean, default: true, description: 全局熔断开关 }
        index:
          type: object
          properties:
            java_xmx: { type: string, default: "3g" }
            summary_batch_size: { type: integer, default: 40 }
            summary_concurrency: { type: integer, default: 4 }
        security:
          type: object
          properties:
            session_ttl_hours: { type: integer, default: 168 }
            invite_ttl_hours: { type: integer, default: 48 }
            max_concurrent_asks: { type: integer, default: 4 }
        alerts:
          type: object
          properties:
            webhook_url: { type: string, writeOnly: true }
            daily_token_threshold: { type: integer }
            daily_cost_threshold_usd: { type: number }

    UsageReport:
      type: object
      required: [from, to, totals, buckets]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: "#/components/schemas/Usage" }
        buckets:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              requests: { type: integer }
              prompt_tokens: { type: integer }
              completion_tokens: { type: integer }
              cost_usd: { type: number, format: float }

    AuditEntry:
      type: object
      required: [id, actor, action, created_at]
      properties:
        id: { type: string }
        actor:
          type: [string, "null"]
          description: 用户名（缺失时退回 actor id）；系统动作（如 `version.recorded`）为 `null`。
        action: { type: string, example: "user.role_changed" }
        target: { type: string }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        ip: { type: string }
