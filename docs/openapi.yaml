openapi: 3.1.0
info:
  title: MC Librarian API
  version: 0.2.0
  summary: Minecraft 源码知识库与问答服务
  description: |
    面向 agent 与人类、带账号体系的代码知识库服务。对每个 Minecraft 版本提供三路混合检索：

    - **summary** — 中文类摘要（中文问题直接映射到类）
    - **symbol** — 类/方法/字段符号表（tree-sitter 派生）
    - **literal** — 源码字面量与正则检索（ripgrep 派生）

    设计约束：检索接口无状态、`version` 显式必传（不支持 `latest`）；响应带 `why` 与
    `suggestions`；调用方用 `max_tokens` 控制上下文预算；索引由 `JobRunner` 异步执行，
    接口只返回 `202 + job_id`。

servers:
  - url: https://mc-librarian.belovedyaoo.top
    description: 生产（公网边缘节点 47.122.113.116）
  - url: http://127.0.0.1:8787
    description: 本地开发

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: meta
  - name: retrieve
  - name: read
  - name: answer
  - name: auth
  - name: admin

paths:
  /v1/health:
    get:
      tags: [meta]
      summary: 存活探针
      security: []
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, example: "0.2.0" }

  /v1/setup:
    get:
      tags: [auth]
      summary: 是否需要初始化管理员
      description: |
        控制面 `users` 表为空时返回 `required: true`，前端据此把首次访问引导到 `/setup`；
        创建唯一管理员后永久返回 `false`。公开端点，无需会话。
      security: []
      operationId: getSetupStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
    post:
      tags: [auth]
      summary: 创建唯一管理员并直接登录
      description: |
        仅在 `users` 表为空时可用。成功后返回 `201`、创建出的管理员，并**直接下发会话 cookie**
        （与 `POST /v1/auth/login` 同一套 cookie），前端创建完即可进入后台。
        已初始化时返回 `410`，不再重建、也不覆盖现有账号。公开端点，无需会话。
      security: []
      operationId: createFirstAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: 已创建并登录
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `mc_librarian_session`，HttpOnly + SameSite=Lax；`Secure` 由服务端配置
                `MC_LIBRARIAN_COOKIE_SECURE` 控制（本地 http 为 false，生产为 true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "410": { $ref: "#/components/responses/SetupCompleted" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/versions:
    get:
      tags: [meta]
      summary: 已索引版本列表
      operationId: listVersions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/VersionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/minecraft-versions:
    get:
      tags: [admin]
      summary: 可注册的 Minecraft 版本列表
      description: |
        版本页「注册索引」对话框的可搜索下拉框数据源。从 Mojang 版本清单
        （`version_manifest_v2.json`）拉取，**只返回 `type == "release"`** 的版本，
        按发布时间倒序；字段 `{id, released_at}`。
        进程内缓存 1 小时；网络失败时若缓存可用就返回缓存（stale 也比空列表好），
        否则返回 `502`。
      operationId: listMinecraftVersions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MinecraftVersionList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /v1/search:
    post:
      tags: [retrieve]
      summary: 混合检索（摘要 / 符号 / 字面量）
      description: |
        四路召回在服务端融合，调用方不需要知道该用哪条通道：

        - **symbol** — 索引库的类/方法/字段，复用 `/v1/symbol` 的四级匹配（fqn → simple → 后缀 → 编辑距离）
        - **literal** — ripgrep 子进程扫 `<data_dir>/src/<version>/`，按文件路径 + 行号排序
        - **reference** — query 命中某个符号名时反查 `refs` 表里的引用点
        - **summary** — `summaries_fts`（FTS5，`#7` 落地；表不存在时该路为空，不报错）。
          query 与入库时一样先过 jieba 分词：`unicode61` 不切中文，不预分词的话两字词
          （「刷怪」）命中不了

        融合用 RRF（`1/(60+rank)` 逐路累加，再按本次最高分归一化到 `[0, 1]`），
        每路各取前 50 条候选。`why` 是去重后的来源数组，顺序固定 `summary → symbol →
        literal → reference`，至少含一个值。`detail=locate` 只返回定位信息（不含
        `snippet` 与 `summary`），`snippet` 额外附带源码片段。`max_tokens` 按 score 降序累加
        `tokens` 截断，至少保留第一条。`path_prefix` 在候选阶段过滤（三路各自带 path 条件）。
        任何一路为空都不算错误：无命中时返回 `200` + 空 `hits` / `suggestions`。
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/symbol:
    get:
      tags: [retrieve]
      summary: 符号查找
      description: |
        按「全限定名 → 简单名 → 后缀 → 编辑距离」四级依次尝试，**先命中先返回，不跨级别混合**；
        `fuzzy=false` 只做前两级。结果上限 50 条。
      operationId: getSymbol
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: fuzzy
          in: query
          schema: { type: boolean, default: true }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/SymbolKind" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items: { $ref: "#/components/schemas/SymbolDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/references:
    get:
      tags: [retrieve]
      summary: 反查引用
      description: "`symbol` 是方法名或 `Class#method`；数据来自 AST 启发式提取，召回优先。"
      operationId: getReferences
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: symbol
          in: query
          required: true
          schema: { type: string }
          description: 方法名或 `Class#method`
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/outline:
    get:
      tags: [read]
      summary: 文件骨架
      description: |
        包名、imports、类与方法签名和行号，不含方法体；`imports` 实时从源码文件解析。
        版本未注册、索引文件不存在、索引里没有该文件或源码缺失都返回 404。
      operationId: getOutline
      parameters:
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/read:
    get:
      tags: [read]
      summary: 源码切片
      description: |
        `start`/`end` 必填，不提供整文件读取。行号 1-based 闭区间；`start < 1`、`end < start`
        或 `end > total_lines` 都返回 422，`detail` 带上文件总行数。超出 `max_tokens` 时按行
        从尾部截断，`truncated: true` 并把 `end` 下调到截断处。
      operationId: readFile
      parameters:
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/Path"
        - name: start
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: end
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: max_tokens
          in: query
          schema: { type: integer, minimum: 100, maximum: 32000, default: 4000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileSlice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/ask:
    post:
      tags: [answer]
      summary: 中文问答（服务端检索循环）
      description: |
        服务端把检索服务层包成 5 个工具（search / symbol / references / outline / read），
        跑「检索 → 读取 → 作答」循环：默认返回 `text/event-stream`：`step` → `delta`* →
        `citation`* → `done`。请求头 `Accept: application/json` 时退化为一次性返回完整
        `AskResponse`。模型超时 / 不可用 / 返回非法响应时降级为「已召回的代码位置」，HTTP 仍是
        200。
      operationId: ask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: |
            OK：默认 `text/event-stream`（`step` → `delta`* → `citation`* → `done`）；
            请求头 `Accept: application/json` 时一次性返回完整 `AskResponse`。
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/AskEvent" }
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "429":
          description: 问答已被管理员暂停，或并发问答已达上限（`max_concurrent_asks`）
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: 未配置生成模型（缺 `MC_LIBRARIAN_LLM_BASE_URL` / `_MODEL` / `_API_KEY`）
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/conversations:
    get:
      tags: [answer]
      summary: 我的历史会话列表
      description: |
        只返回当前用户自己的会话，按 `updated_at` 降序；`message_count` 是会话内的消息条数
        （用户问题 + 助手答案）。会话在首次 `/v1/ask` 时自动创建，最多保留每用户 200 个。
      operationId: listConversations
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/conversations/{conversationId}:
    get:
      tags: [answer]
      summary: 历史会话详情
      description: |
        会话标题与全部消息（含引用与用量）。**别人的会话一律 404**（不是 403，避免泄露会话
        是否存在）。
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [answer]
      summary: 删除历史会话
      description: 级联删除该会话的全部消息；别人的会话一律 404。
      operationId: deleteConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204": { description: 已删除 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: 登录（换取 session cookie）
      description: |
        用户名不存在、密码错误、账号被禁用一律返回同一个 `401` 与同一句文案，
        不暴露「用户是否存在」。成功后更新 `last_login_at` 并下发新的会话 cookie。
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `mc_librarian_session`，HttpOnly + SameSite=Lax；`Secure` 由服务端配置
                `MC_LIBRARIAN_COOKIE_SECURE` 控制（本地 http 为 false，生产为 true），
                有效期见服务端 `session_ttl_hours`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: 注销当前会话
      description: |
        删除服务端会话行并清除 cookie。登出后同一个 cookie 再用即 401；
        没有有效会话时同样返回 401（调用方可以忽略并直接跳登录页）。
      operationId: logout
      responses:
        "204": { description: 已注销 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/tokens:
    get:
      tags: [auth]
      summary: 我的 access token 列表
      operationId: listTokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: { $ref: "#/components/schemas/TokenInfo" }
    post:
      tags: [auth]
      summary: 签发 access token
      description: 明文 token 只在创建时返回一次。
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650, default: 365 }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: 仅此一次返回 }
                  info: { $ref: "#/components/schemas/TokenInfo" }

  /v1/auth/tokens/{tokenId}:
    delete:
      tags: [auth]
      summary: 吊销 access token
      operationId: revokeToken
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已吊销 }

  /v1/invites/{token}:
    get:
      tags: [auth]
      summary: 校验邀请链接
      description: |
        链接仍可用时 `valid: true` 并给出对应的用户名；不存在、已使用、已过期或账号被禁用
        一律 `valid: false`（不区分具体原因）。公开端点，无需会话。
      security: []
      operationId: getInvite
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteStatus" }

  /v1/invites/{token}/accept:
    post:
      tags: [auth]
      summary: 接受邀请（设置密码并登录）
      description: |
        被邀请人自设密码，成功后激活账号并**直接下发会话 cookie**（与 `POST /v1/auth/login`
        同一套 cookie），因此设完密码即已登录。链接一次性：成功即标记已用，再用返回 `404`。
        公开端点，无需会话。
      security: []
      operationId: acceptInvite
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInviteRequest" }
      responses:
        "201":
          description: 已设置密码并登录
          headers:
            Set-Cookie:
              schema: { type: string }
              description: |
                `mc_librarian_session`，HttpOnly + SameSite=Lax；`Secure` 由服务端配置
                `MC_LIBRARIAN_COOKIE_SECURE` 控制（本地 http 为 false，生产为 true）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/versions:
    post:
      tags: [admin]
      summary: 注册已上传的索引
      description: |
        节点侧不构建索引。管理员把本地生成的 `db/<version>.sqlite` 放进数据根后调用本接口，
        服务端校验文件并写入版本注册表。文件不存在或校验失败返回 422。
      operationId: registerVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", examples: ["26.3"] }
                obfuscated: { type: boolean, default: true }
      responses:
        "201":
          description: 已注册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/users:
    get:
      tags: [admin]
      summary: 用户列表
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
    post:
      tags: [admin]
      summary: 创建用户
      description: 创建后返回一次性邀请链接；管理员不设置也不需要知道用户密码。
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 3, maxLength: 32, pattern: "^[a-zA-Z0-9_.-]+$" }
                role: { type: string, enum: [admin, user], default: user }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [user, invite_url]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  invite_url:
                    type: string
                    description: 一次性邀请链接（站点根下的相对路径），48 小时有效
        "409": { description: 用户名已存在 }

  /v1/admin/users/{userId}:
    patch:
      tags: [admin]
      summary: 修改角色或启用状态
      description: 不允许把最后一个 admin 降级或停用。
      operationId: patchUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, user] }
                enabled: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 违反最后管理员保护 }

  /v1/admin/jobs:
    get:
      tags: [admin]
      summary: 任务列表
      operationId: listJobs
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: 创建索引任务
      description: |
        立即返回 202，实际执行由 JobRunner 串行消费（并发 1）。
        阶段序列由 `options.source_dir` 决定：给了源目录走 `parse → summarize → finalize`；
        省略 `options` 则从官方 jar 起跑完整五段 `download → decompile → parse → summarize → finalize`；
        给了 `options` 但 `source_dir` 为空返回 422。见 `JobCreate`。
        本实例关闭索引构建（`settings.index.enabled=false`）时返回 403。
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreate" }
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: 已有同类任务在运行或该版本正在索引 }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/jobs/{jobId}:
    get:
      tags: [admin]
      summary: 任务详情
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/jobs/{jobId}/logs:
    get:
      tags: [admin]
      summary: 任务日志
      description: "按 `?after=<id>` 增量拉取：只返回 id 大于 `after` 的日志。"
      operationId: getJobLogs
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: after
          in: query
          schema: { type: integer, default: 0 }
          description: 返回 id 大于该值的日志
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { $ref: "#/components/schemas/JobLog" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [admin]
      summary: 取消任务
      description: 只对 queued/running 有效；running 任务在当前阶段边界停止。
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已请求取消
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 任务已结束，无法取消 }

  /v1/admin/jobs/{jobId}/retry:
    post:
      tags: [admin]
      summary: 重试任务
      description: |
        只对 `failed` / `canceled` 有效：保留 checkpoint，把同一任务重新置为 `queued`，
        从下一个未完成的阶段续跑。其他状态返回 `409`。
        本实例关闭索引构建（`settings.index.enabled=false`）时返回 `403`（重排后 runner 会跑反编译）。
      operationId: retryJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已重新排队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: 任务不在可重试的终态（仅 failed/canceled） }

  /v1/admin/settings:
    get:
      tags: [admin]
      summary: 读取设置
      description: |
        值 = `settings` 表里的覆盖 + `MC_LIBRARIAN_*` 运行时配置兜底；每次请求实时查库，
        所以保存后立即生效。只返回**真实存在**的值：`llm.base_url` / `llm.model` / 告警阈值
        未配置时整字段省略，不拿示例默认值填充。密钥只回 `api_key_set` / `webhook_url_set`。
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: 更新设置
      description: |
        **部分更新**：只改请求里给出的字段，未给的保持原值（前端可以只提交一个开关）。
        值给 `null`（密钥给空字符串）= 清除该覆盖，回退环境配置。
        `index.enabled` 是部署级闸门（只读），不在可改项里，传了返回 `422`。
        保存后立即生效，不需要重启；每次更新写一条 `settings.updated` 审计，只记改了哪些键。
      operationId: putSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsUpdate" }
      responses:
        "200":
          description: OK（返回更新后的完整设置）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/usage:
    get:
      tags: [admin]
      summary: 用量统计
      description: |
        按请求粒度记录，可按 `group_by` 聚合。无硬预算，仅用于观测与告警（D23）。

        - `totals` 与 `buckets` 由服务端同源算出（同一个区间条件），页面直接用这些数字，
          不在前端再算一遍。
        - 区间内没有数据时返回零值（`totals` 全 0、`buckets` 为空数组），**不是报错**。
        - `totals.latency_ms` 是区间内所有请求的耗时**之和**（与其余字段同为合计口径）。
        - 分天口径是**本地日期（UTC+8）**，与告警的 `day` 一致。
        - `from`/`to` 缺省为最近 7 天（含今天）；`from` 晚于 `to` 时自然为空，不报错。
        - `user_id` 按 `usage.user_id`（用户 id）过滤；`group_by=user` 的 `key` 优先显示用户名，
          取不到时退回 id。
        - 只审计 token，不含金额（`usage.cost_usd` 已在迁移 v11 删除）。
        - 调用时顺带做一次当日告警检查（幂等、不阻塞响应）。
      operationId: getUsage
      parameters:
        - name: from
          in: query
          description: 起始日期（本地日期，含当天）；缺省为 `to` 往前 7 天
          schema: { type: string, format: date }
        - name: to
          in: query
          description: 结束日期（本地日期，含当天）；缺省为今天
          schema: { type: string, format: date }
        - name: user_id
          in: query
          description: 只看某个用户（`usage.user_id`）
          schema: { type: string }
        - name: group_by
          in: query
          schema: { type: string, enum: [day, user, version, model], default: day }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/BadRequest" }

  /v1/admin/audit:
    get:
      tags: [admin]
      summary: 审计日志
      operationId: listAudit
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: actor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mc_librarian_session
    bearerAuth:
      type: http
      scheme: bearer
      description: 个人 access token（`mcl_` 前缀）

  parameters:
    Version:
      name: version
      in: query
      required: true
      schema: { type: string, examples: ["1.20.1"] }
      description: 目标版本，必须已完成索引；不支持 latest
    Path:
      name: path
      in: query
      required: true
      schema: { type: string }
      description: 相对该版本源码根（`src/<version>/`）的路径
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string }
      description: 邀请链接里的明文 token
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
      description: 历史会话 id

  responses:
    BadRequest:
      description: 请求非法
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        未认证：缺少/过期/已注销的会话 cookie，或登录凭据不正确。
        登录失败的 `detail` 恒定，不区分「用户不存在」与「密码错误」。
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: 已认证但无权访问（例如 `user` 访问 `/v1/admin/*`）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SetupCompleted:
      description: 已完成初始化：唯一管理员已存在，不再开放 setup
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadGateway:
      description: 上游不可用（例如拉取 Mojang 版本清单失败且没有可用缓存）
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "about:blank" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }

    SymbolKind:
      type: string
      enum: [any, class, method, field]
      default: any

    VersionInfo:
      type: object
      required: [version, files, tokens, indexed_at]
      properties:
        version: { type: string }
        files: { type: integer }
        tokens: { type: integer, description: 源码 token 总量（cl100k 估算） }
        indexed_at: { type: string, format: date-time }
        obfuscated: { type: boolean, description: 源码是否经官方映射重映射（remap） }
        has_summaries: { type: boolean, description: 登记时索引库是否已带摘要（任务跑过 `summarize` 时为真） }
        source_size_bytes: { type: integer, description: 源码树字节数（`.java` 与 `data/` 下 `.json` 的总字节数，与任务产出一致） }
        summary_count: { type: integer, description: 已生成的摘要条数（从索引库实时读，`summaries` 的行数） }
        class_count: { type: integer, description: 类总数（摘要覆盖率的分母，从索引库实时读） }

    MinecraftVersion:
      type: object
      required: [id, released_at]
      properties:
        id: { type: string, description: 版本号，例如 1.21.1 }
        released_at: { type: string, format: date-time, description: 发布时间（Mojang 清单的 `releaseTime`） }

    MinecraftVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          description: 仅 `type == "release"` 的版本，按发布时间倒序
          items: { $ref: "#/components/schemas/MinecraftVersion" }

    SearchRequest:
      type: object
      required: [query, version]
      properties:
        query: { type: string, minLength: 1, maxLength: 512 }
        version: { type: string }
        path_prefix: { type: string }
        kind: { $ref: "#/components/schemas/SymbolKind" }
        detail:
          type: string
          enum: [locate, snippet]
          default: snippet
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
        max_tokens: { type: integer, minimum: 200, maximum: 32000, default: 4000 }

    SearchResponse:
      type: object
      required: [query, version, hits, total, took_ms]
      properties:
        query: { type: string }
        version: { type: string }
        hits:
          type: array
          items: { $ref: "#/components/schemas/Hit" }
        suggestions:
          type: array
          items: { type: string }
        total: { type: integer, description: 融合前的候选总数（各路候选之和），不因 limit / max_tokens 截断而变 }
        took_ms: { type: integer }

    Hit:
      type: object
      required: [id, type, version, path, lines, score, why]
      properties:
        id:
          type: string
          description: |
            融合实体键（`<version>:<path>#<symbol>:<start>-<end>`，文件级命中为 `<version>:<path>:<line>`）。
            带行区间是为了让同名重载方法拿到不同的 id（前端列表靠它做 key）。
          example: "1.20.1:net/minecraft/world/entity/MobCategory.java#MobCategory:6-68"
        type: { type: string, enum: [class, method, field, file] }
        version: { type: string }
        path: { type: string }
        symbol: { type: string }
        lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        score: { type: number, format: float }
        why:
          type: array
          items: { type: string, enum: [summary, symbol, literal, reference] }
        summary: { type: string }
        snippet: { type: string }
        tokens:
          type: integer
          description: |
            这条命中要占多少上下文，按**实际返回内容**计（`cl100k_base` 真分词）：
            `detail=locate` 只算定位字段，`snippet` 另含片段与摘要；`max_tokens` 按它累加。

    SymbolDetail:
      type: object
      required: [fqn, kind, path, lines]
      properties:
        fqn: { type: string }
        kind: { type: string, enum: [class, method, field] }
        signature: { type: string }
        path: { type: string }
        lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        superclass: { type: string }
        interfaces: { type: array, items: { type: string } }
        annotations: { type: array, items: { type: string } }
        summary: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [method, field] }
              name: { type: string }
              signature: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }

    ReferenceResponse:
      type: object
      required: [symbol, version, references]
      properties:
        symbol: { type: string }
        version: { type: string }
        references:
          type: array
          items:
            type: object
            required: [path, lines]
            properties:
              path: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
              enclosing: { type: string }
              kind: { type: string, enum: [call, field, type, other] }
              snippet: { type: string }

    Outline:
      type: object
      required: [path, package, classes]
      properties:
        path: { type: string }
        package:
          type: [string, "null"]
          description: 包名；`data/` 下的文件与无包声明的 `.java` 为 null
        imports: { type: array, items: { type: string } }
        classes:
          type: array
          items:
            type: object
            properties:
              fqn: { type: string }
              kind: { type: string, enum: [class, interface, enum, record, annotation] }
              signature: { type: string }
              lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
              methods:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    signature: { type: string }
                    lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }

    FileSlice:
      type: object
      required: [path, version, start, end, content, truncated]
      properties:
        path: { type: string }
        version: { type: string }
        start: { type: integer }
        end: { type: integer }
        total_lines: { type: integer }
        content: { type: string }
        truncated: { type: boolean }

    AskRequest:
      type: object
      required: [question, version]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        version: { type: string }
        conversation_id:
          type: string
          description: |
            续聊时带上历史会话 id（从 `done` 事件或 `GET /v1/conversations` 取）；省略则新建会话。
            不是本人会话一律 404。
        max_steps:
          type: [integer, "null"]
          minimum: 1
          maximum: 12
          description: 省略时用服务端设置 `settings.ask.max_steps`（默认 6）
        max_answer_tokens:
          type: [integer, "null"]
          minimum: 500
          maximum: 32000
          description: 省略时用服务端设置 `settings.ask.max_answer_tokens`（默认 8000）

    AskEvent:
      oneOf:
        - type: object
          required: [type, tool]
          properties:
            type: { type: string, const: step }
            tool: { type: string }
            args: { type: object, additionalProperties: true }
            ok: { type: boolean }
            hits: { type: integer }
        - type: object
          required: [type, text]
          properties:
            type: { type: string, const: delta }
            text: { type: string }
        - type: object
          required: [type, path, lines]
          properties:
            type: { type: string, const: citation }
            path: { type: string }
            lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
            symbol: { type: string }
        - type: object
          required: [type, usage, reason, conversation_id]
          properties:
            type: { type: string, const: done }
            usage: { $ref: "#/components/schemas/Usage" }
            reason: { $ref: "#/components/schemas/AskReason" }
            conversation_id:
              type: string
              description: 本次问答所属的历史会话 id（新建或续聊的那个）
        - type: object
          required: [type, problem]
          properties:
            type: { type: string, const: error }
            problem: { $ref: "#/components/schemas/Problem" }

    AskResponse:
      type: object
      required: [answer, citations, steps, usage, reason]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/AskStep" }
        usage: { $ref: "#/components/schemas/Usage" }
        reason: { $ref: "#/components/schemas/AskReason" }

    AskStep:
      type: object
      required: [tool]
      properties:
        tool: { type: string }
        args: { type: object, additionalProperties: true }

    Citation:
      type: object
      required: [path, lines]
      properties:
        path: { type: string }
        lines: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
        symbol: { type: string }

    AskReason:
      type: string
      enum: [stop, max_steps, degraded]
      description: |
        `done` 的收尾原因：`stop` = 模型不再调用工具、正常作答；`max_steps` = 达到检索步数上限后
        强制收尾；`degraded` = 模型超时/不可用/返回非法响应，用已召回的检索结果降级作答。

    ConversationSummary:
      type: object
      required: [id, title, created_at, updated_at, message_count]
      properties:
        id: { type: string }
        title: { type: string, description: 首条问题，截断到 30 字（超出加 `…`） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        message_count: { type: integer, description: 会话内的消息条数（用户问题 + 助手答案） }

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/ConversationSummary" }

    ConversationMessage:
      type: object
      required: [role, content, citations, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        usage:
          anyOf:
            - $ref: "#/components/schemas/Usage"
            - type: "null"
          description: 只有助手消息有；用户消息为 null
        version:
          type: [string, "null"]
          description: |
            这一轮提问用的版本。引用的 `path` 是版本相关的，历史引用按它打开。
            迁移 v10 之前落库的历史行为 null，前端回退到当前选中的版本并提示。
        created_at: { type: string, format: date-time }

    ConversationDetail:
      type: object
      required: [id, title, messages]
      properties:
        id: { type: string }
        title: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }

    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        latency_ms: { type: integer }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8, maxLength: 128 }

    SetupStatus:
      type: object
      required: [required]
      properties:
        required: { type: boolean, description: 控制面还没有任何用户，需要先创建管理员 }

    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_.-]+$"
        password: { type: string, minLength: 8, maxLength: 128 }

    InviteStatus:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        username:
          type: string
          description: 邀请对应的用户名；链接无效时为空

    AcceptInviteRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }

    User:
      type: object
      required: [id, username, role, enabled]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
        last_login_at: { type: string, format: date-time }

    TokenInfo:
      type: object
      required: [id, name, prefix, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 前 8 位，用于辨认 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    Job:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [index] }
        version: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        stage:
          type: string
          enum: [download, decompile, parse, summarize, finalize]
          description: |
            任务当前阶段。阶段序列由 `options.source_dir` 决定：给了源目录走
            `parse → summarize → finalize`（#4），否则从官方 jar 起跑完整五段
            `download → decompile → parse → summarize → finalize`（#21 的下载与反编译是前两段，
            产物就是 `parse` 消费的源码树）。
        progress: { type: number, format: float, minimum: 0, maximum: 1 }
        message: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_by: { type: string }

    JobCreate:
      type: object
      required: [kind, version]
      properties:
        kind: { type: string, enum: [index] }
        version: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9._-]+$", examples: ["26.3"] }
        options:
          type: object
          properties:
            source_dir:
              type: string
              description: |
                源码根目录；相对路径按数据根解析。**可省略**：

                - 给 `source_dir` → 阶段序列 `parse → summarize → finalize`，任务从 `parse` 开始；
                - 省略 `options`（或不给 `source_dir`）→ 阶段序列
                  `download → decompile → parse → summarize → finalize`，从官方 jar 一路产出索引；
                - 给了 `options` 但 `source_dir` 为空字符串 → 422（空值属于笔误）。

                `parse` 只统计 `.java` 与 `data/` 的文件数与 token 估算。
            obfuscated:
              type: boolean
              description: |
                该版本源码是否经官方映射 remap（写入注册表 `VersionInfo.obfuscated`）。**可省略**：

                - 显式给值 → 用它；
                - 显式传 `null` → 422（契约里是 boolean、非 nullable，省略才是「未声明」）；
                - 省略且任务跑过 `download` → 用 checkpoint 里的真值（等于该版本是否需要官方 mappings）；
                - 省略且为 parse-only → 按「已 remap」记录（`true`）。parse-only 的典型来源是本地
                  `fetch` 出来、已经 remap 过的源码树；26.x 这类本来就不混淆的版本请显式传 `false`。
            force: { type: boolean, default: false }

    JobLog:
      type: object
      required: [id, ts, level, message]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        message: { type: string }

    Settings:
      type: object
      description: |
        `GET/PUT /v1/admin/settings` 的响应。值 = 数据库覆盖 + 环境配置兜底；
        未配置的可选字段（`llm.base_url` / `llm.model` / 告警阈值）整字段省略。
      required: [llm, ask, index, security, alerts]
      properties:
        llm: { $ref: "#/components/schemas/LlmSettings" }
        ask: { $ref: "#/components/schemas/AskSettings" }
        index: { $ref: "#/components/schemas/IndexSettings" }
        security: { $ref: "#/components/schemas/SecuritySettings" }
        alerts: { $ref: "#/components/schemas/AlertsSettings" }

    LlmSettings:
      type: object
      description: 生成模型配置。密钥只写不读：响应里只有 `api_key_set`，不回明文也不回密文。
      required: [temperature, timeout_s, api_key_set]
      properties:
        base_url:
          type: [string, "null"]
          description: OpenAI 兼容端点；未配置（环境变量与数据库都没有）时整字段省略
        model:
          type: [string, "null"]
          example: "deepseek-4.1-flash"
        temperature:
          type: number
          description: 采样温度；默认 0（确定性输出，摘要与问答都要求可复现），上限 2
        timeout_s:
          type: number
          default: 120
          description: 单次 LLM 请求的超时（秒）
        api_key_set:
          type: boolean
          readOnly: true
          description: 是否已设置 `llm.api_key`（数据库覆盖或环境变量任一有值）

    AskSettings:
      type: object
      required: [max_steps, max_answer_tokens, max_context_tokens, timeout_s, enabled]
      properties:
        max_steps:
          type: integer
          default: 6
          description: "`AskRequest.max_steps` 省略时的服务端默认值"
        max_answer_tokens:
          type: integer
          default: 8000
          description: "`AskRequest.max_answer_tokens` 省略时的服务端默认值"
        max_context_tokens:
          type: integer
          default: 60000
          description: 工具结果累积的上下文预算（token）；超出时从最旧的工具结果开始丢弃
        timeout_s: { type: integer, default: 120 }
        enabled:
          type: boolean
          default: true
          description: 全局熔断开关；`false` 时 `/v1/ask` 返回 429，检索不受影响

    IndexSettings:
      type: object
      required:
        [enabled, java_xmx, java, data_dir, summary_batch_size, summary_concurrency]
      properties:
        enabled:
          type: boolean
          default: true
          description: |
            索引构建闸门。`false` 时本实例不构建索引：`POST /v1/admin/jobs` 返回 403，
            索引改在本地工作站产出后用 `POST /v1/admin/versions` 注册。
        java_xmx:
          type: string
          default: "4G"
          pattern: '^\d+[kKmMgG]$'
          description: 反编译时传给 java 的 `-Xmx`
        java:
          type: string
          default: "java"
          description: java 可执行路径；留空 = 回退环境变量
        vineflower_jar:
          type: string
          description: Vineflower 反编译工具 jar 路径；空字符串 = 回退环境变量
        specialsource_jar:
          type: string
          description: SpecialSource remap 工具 jar 路径；空字符串 = 回退环境变量
        data_dir:
          type: string
          readOnly: true
          description: 数据根绝对路径；注册索引时把 `db/<版本>.sqlite` 放进这里
        summary_batch_size: { type: integer, default: 40 }
        summary_concurrency: { type: integer, default: 4 }

    SecuritySettings:
      type: object
      required: [session_ttl_hours, invite_ttl_hours, max_concurrent_asks]
      properties:
        session_ttl_hours:
          type: integer
          default: 168
          description: 会话有效期（小时）；改后只影响新下发的 cookie
        invite_ttl_hours:
          type: integer
          default: 48
          description: 一次性邀请链接的有效期（小时）
        max_concurrent_asks:
          type: integer
          default: 4
          description: 同时在跑的问答数上限；超出返回 429

    AlertsSettings:
      type: object
      description: 用量告警（`GET /v1/admin/usage` 的阈值与 Webhook）。未配置的阈值不回 0。
      required: [webhook_url_set]
      properties:
        webhook_url_set:
          type: boolean
          readOnly: true
          description: 是否已设置 `alerts.webhook_url`
        daily_token_threshold:
          type: [integer, "null"]
          description: 每日 token 告警阈值；未配置时整字段省略

    SettingsUpdate:
      type: object
      additionalProperties: false
      description: |
        `PUT /v1/admin/settings` 的请求体。**部分更新**：只有出现在请求里的字段会被写，
        未给的保持原值；值给 `null`（密钥给空字符串）= 清除该覆盖，回退环境配置。
        未列出的字段（如 `index.data_dir`）一律不可改，传了返回 422。
      properties:
        llm: { $ref: "#/components/schemas/LlmSettingsUpdate" }
        ask: { $ref: "#/components/schemas/AskSettingsUpdate" }
        index: { $ref: "#/components/schemas/IndexSettingsUpdate" }
        security: { $ref: "#/components/schemas/SecuritySettingsUpdate" }
        alerts: { $ref: "#/components/schemas/AlertsSettingsUpdate" }

    LlmSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        base_url: { type: [string, "null"], maxLength: 500 }
        model: { type: [string, "null"], maxLength: 200 }
        api_key:
          type: [string, "null"]
          maxLength: 500
          writeOnly: true
          description: 空字符串（或 `null`）= 清除密钥；明文只进不出
        temperature: { type: [number, "null"], minimum: 0, maximum: 2 }
        timeout_s: { type: [number, "null"], exclusiveMinimum: 0 }

    AskSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        max_steps: { type: [integer, "null"], minimum: 1, maximum: 12 }
        max_answer_tokens: { type: [integer, "null"], minimum: 500, maximum: 32000 }
        max_context_tokens: { type: [integer, "null"], minimum: 1000 }
        timeout_s: { type: [integer, "null"], minimum: 1, maximum: 3600 }
        enabled: { type: [boolean, "null"] }

    IndexSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: [boolean, "null"] }
        java_xmx: { type: [string, "null"], pattern: '^\d+[kKmMgG]$' }
        java: { type: [string, "null"], maxLength: 1000 }
        vineflower_jar: { type: [string, "null"], maxLength: 1000 }
        specialsource_jar: { type: [string, "null"], maxLength: 1000 }
        summary_batch_size: { type: [integer, "null"], minimum: 1, maximum: 500 }
        summary_concurrency: { type: [integer, "null"], minimum: 1, maximum: 64 }

    SecuritySettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        session_ttl_hours: { type: [integer, "null"], minimum: 1, maximum: 8760 }
        invite_ttl_hours: { type: [integer, "null"], minimum: 1, maximum: 8760 }
        max_concurrent_asks: { type: [integer, "null"], minimum: 1, maximum: 64 }

    AlertsSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        webhook_url:
          type: [string, "null"]
          maxLength: 500
          writeOnly: true
          description: 空字符串（或 `null`）= 清除；明文只进不出
        daily_token_threshold: { type: [integer, "null"], minimum: 0, description: 写 0 = 关闭该指标告警 }

    UsageReport:
      type: object
      required: [from, to, requests, totals, buckets]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        requests:
          type: integer
          description: 区间内的请求总数（顶部卡片的「请求数」直接用这个值）
        totals: { $ref: "#/components/schemas/Usage" }
        buckets:
          type: array
          items:
            type: object
            required: [key, requests, prompt_tokens, completion_tokens]
            properties:
              key: { type: string }
              requests: { type: integer }
              prompt_tokens: { type: integer }
              completion_tokens: { type: integer }

    AuditEntry:
      type: object
      required: [id, actor, action, created_at]
      properties:
        id: { type: string }
        actor:
          type: [string, "null"]
          description: 用户名（缺失时退回 actor id）；系统动作（如 `version.recorded`）为 `null`。
        action: { type: string, example: "user.role_changed" }
        target: { type: string }
        detail: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        ip: { type: string }
