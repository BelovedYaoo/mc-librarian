[project]
name = "mc-librarian-api"
version = "0.2.0"
description = "mc-librarian：Minecraft 源码知识库与中文问答服务 · 后端 API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "argon2-cffi>=25.1",
  "fastapi>=0.118",
  # 摘要层的 FTS5 预分词（#7 规格 §6）：`trigram` 对两字词（「刷怪」）不友好，`unicode61`
  # 又不切中文，所以入库前用 jieba 切好、查询时对 query 做同样切分。
  "jieba>=0.42",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  # token 计数口径：`#13` 的验收标准（26.3 约 7.5M token）是用 cl100k 真分词器实测的，
  # 常数估算在同一批源码上偏 13%–27%，两个口径不可比。装不上时退回常数估算并写 warn。
  "tiktoken>=0.14",
  # 钉在 <0.26：0.26.0 的 Python 绑定在遍历成员（读 `member.type` /
  # `child_by_field_name`）时会堆损坏，真实大源码树上随机段错误，且无法在代码层规避
  # （不是 Tree 生命周期问题）。见 issue #22，上游修复后再解除。
  "tree-sitter>=0.24,<0.26",
  "tree-sitter-java>=0.23",
  "uvicorn[standard]>=0.37",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "mypy>=1.19",
  "openapi-spec-validator>=0.7.2",
  # 内存峰值采样（`mc-librarian index`，规格补充 §3）：只在本地跑真实流水线时用，
  # 生产不装；导入失败时流水线照跑，只跳过测量并记一条 warn。
  "psutil>=7.0",
  "pytest>=8.4",
  "pyyaml>=6.0.2",
  "ruff>=0.14",
  "types-pyyaml>=6.0.12",
]

[project.scripts]
# `mc-librarian fetch ...` 与 `python -m mc_librarian fetch ...` 是同一个入口。
mc-librarian = "mc_librarian.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_librarian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "network: 需要联网下载真实 jar / 跑真反编译的端到端测试，默认跳过（--run-network 或 MC_LIBRARIAN_NETWORK=1 启用）",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文文案里的全角标点是刻意的，不当作 ambiguous unicode。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mc_librarian"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# psutil 不带 py.typed（上游把类型放在独立的 types-psutil 里）。本仓只用它采样 RSS，
# 不引入额外的 stubs 依赖，按未类型化模块处理。
[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

# jieba 也不带类型标注；本仓只用 `cut` 与 `setLogLevel`。
[[tool.mypy.overrides]]
module = "jieba"
ignore_missing_imports = true
